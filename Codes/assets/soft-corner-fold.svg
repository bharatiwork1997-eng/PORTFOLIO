<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background desk tone that shows under the lifted corner -->
    <radialGradient id="deskHole" cx="75%" cy="75%" r="70%">
      <stop offset="0%" stop-color="#080806" />
      <stop offset="65%" stop-color="#0c0b09" />
      <stop offset="100%" stop-color="#11100d" />
    </radialGradient>

    <!-- Ambient contact shadow cast under the rolled paper onto the desk -->
    <radialGradient id="deskShadow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.65)" />
      <stop offset="50%" stop-color="rgba(0,0,0,0.25)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0)" />
    </radialGradient>

    <!-- Soft shadow cast on the main sheet by the lifted flap -->
    <linearGradient id="sheetShadow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(30,26,20,0.38)" />
      <stop offset="25%" stop-color="rgba(30,26,20,0.14)" />
      <stop offset="60%" stop-color="rgba(30,26,20,0.0)" />
    </linearGradient>

    <!-- Realistic 3D cylindrical paper roll: authentic warm paper color -->
    <linearGradient id="paperCurl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d0c9bc" />
      <stop offset="15%" stop-color="#e2dcd1" />
      <stop offset="42%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f5f0e6" />
      <stop offset="100%" stop-color="#ded7c9" />
    </linearGradient>

    <!-- Specular highlight along the roll's crest -->
    <linearGradient id="rollHighlight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="40%" stop-color="rgba(255,255,255,0.75)" />
      <stop offset="60%" stop-color="rgba(255,255,255,0.3)" />
      <stop offset="100%" stop-color="rgba(0,0,0,0.1)" />
    </linearGradient>

    <!-- Drop shadow for the flap -->
    <filter id="flapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-2.5" dy="-2.5" stdDeviation="3" flood-color="rgba(0,0,0,0.38)" />
    </filter>
  </defs>

  <!-- 1. Mask out the original paper corner with the dark background desk tone -->
  <path d="M 0,100 C 24,96 48,84 68,68 C 84,48 96,24 100,0 L 100,100 Z" fill="url(#deskHole)" />
  <path d="M 0,100 C 24,96 48,84 68,68 C 84,48 96,24 100,0 L 100,100 Z" fill="url(#deskShadow)" />

  <!-- 2. Soft contact shadow on the white page just behind the crease -->
  <path d="M 0,100 C 24,96 48,84 68,68 C 84,48 96,24 100,0 L 92,0 C 88,20 78,42 62,60 C 42,78 20,88 0,92 Z"
        fill="url(#sheetShadow)" />

  <!-- 3. The authentic rolled paper flap with soft curvature and organic rounded apex -->
  <!-- Crease runs from (0, 100) to (100, 0) with a gentle concave roll -->
  <!-- Flap tip curves softly inward towards (~28, 28) -->
  <g filter="url(#flapShadow)">
    <path d="M 0,100 C 26,86 44,72 68,50 C 82,38 92,20 100,0 C 80,18 62,30 40,38 C 24,44 14,70 0,100 Z"
          fill="url(#paperCurl)" />
    <path d="M 0,100 C 26,86 44,72 68,50 C 82,38 92,20 100,0 C 80,18 62,30 40,38 C 24,44 14,70 0,100 Z"
          fill="url(#rollHighlight)" />
    <!-- Fine paper edge definition -->
    <path d="M 100,0 C 80,18 62,30 40,38 C 24,44 14,70 0,100"
          fill="none"
          stroke="rgba(255,255,255,0.85)"
          stroke-width="0.75" />
  </g>
</svg>