<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/fonts.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/welcoming-screen.css?v=6" />
	<link rel="preload" as="image" href="assets/img1.png" fetchpriority="high" />
	<link rel="preload" as="image" href="assets/img2.png" fetchpriority="high" />
	<style>
		.standalone-pencil {
			display: none;
			position: fixed;
			z-index: 9999;
			top: 0;
			left: 0;
			width: 26px;
			height: 180px;
			pointer-events: none;
			transform-origin: 12.9px 3.3px;
			transform: translate(-12.9px, -3.3px) rotate(-26deg);
		}
		.standalone-pencil img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: fill;
			filter: drop-shadow(2px 6px 6px rgba(0, 0, 0, 0.25));
		}
	</style>
</head>

<body>
	<h1 class="title-grab-a-seat">GRAB A SEAT</h1>
	<img src="assets/img1.png" class="img1" loading="eager" fetchpriority="high" decoding="sync" />
	<div class="standalone-pencil" id="standalone-pencil" aria-hidden="true"><img src="assets/img2.png" alt="" loading="eager" fetchpriority="high" decoding="sync"></div>

	<script>
		if (window.self === window.top) {
			const pencil = document.getElementById("standalone-pencil");
			if (pencil) {
				let targetX = -200, targetY = -200, raf = false;
				const render = () => {
					raf = false;
					pencil.style.transform = `translate3d(${targetX}px, ${targetY}px, 0) translate(-12.9px, -3.3px) rotate(-26deg)`;
					pencil.style.display = "block";
				};
				const move = (e) => {
					targetX = e.clientX;
					targetY = e.clientY;
					if (!raf) {
						raf = true;
						requestAnimationFrame(render);
					}
				};
				window.addEventListener("pointerenter", move, { passive: true });
				window.addEventListener("pointermove", move, { passive: true });
				window.addEventListener("pointerleave", () => { pencil.style.display = "none"; });
			}
		}
	</script>
</body>

</html>
