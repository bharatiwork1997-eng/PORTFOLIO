<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/fonts.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/welcoming-screen.css?v=5" />
	<style>
		.standalone-pencil {
			display: none;
			position: fixed;
			z-index: 9999;
			top: 0;
			left: 0;
			width: 26px;
			height: 180px;
			pointer-events: none;
			transform-origin: 12.9px 3.3px;
			transform: translate(-12.9px, -3.3px) rotate(-26deg);
		}
		.standalone-pencil img {
			display: block;
			width: 100%;
			height: 100%;
			object-fit: fill;
			filter: drop-shadow(2px 6px 6px rgba(0, 0, 0, 0.25));
		}
	</style>
</head>

<body>
	<h1 class="title-grab-a-seat"><span class="title-line1">GRAB A</span> <span class="title-line2">SEAT</span></h1>
	<img src="assets/img1.png" class="img1" />
	<div class="standalone-pencil" id="standalone-pencil" aria-hidden="true"><img src="assets/img2.png" alt=""></div>

	<script>
		if (window.self === window.top) {
			const pencil = document.getElementById("standalone-pencil");
			if (pencil) {
				const move = (e) => {
					pencil.style.left = e.clientX + "px";
					pencil.style.top = e.clientY + "px";
					pencil.style.display = "block";
				};
				window.addEventListener("pointerenter", move);
				window.addEventListener("pointermove", move);
				window.addEventListener("pointerleave", () => { pencil.style.display = "none"; });
			}
		}
	</script>
</body>

</html>
