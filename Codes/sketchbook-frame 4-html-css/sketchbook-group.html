<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/fonts.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/sketchbook-group.css?v=5" />

</head>

<body>
	<div class="group">
		<!-- Middle box with hover image swap -->
		<div class="input text-input personal-work-box">
			<img src="assets/personal-front.jpg" class="pw-front" alt="Personal Work" />
			<img src="assets/personal-hover.png" class="pw-hover" alt="Personal Work Hover" />
		</div>
		<div class="input number-input"></div>
		<div class="input card"></div>
		<p class="text-personal-work">Personal Work</p>
		<img src="assets/img1.png" class="img1" />
		<img src="assets/img2.png" class="img2" alt="Bharati Kamble Résumé Booklet" role="button" tabindex="0" title="Click to view Bharati Kamble's Résumé" />
		<img src="assets/slider.png" class="slider" />
		<img src="assets/img3.png" class="img3" />
		<img src="assets/img4.png" class="img4" />
		<img src="assets/img4.png" class="img5" />
		<p class="text-experimental">Experimental </p>
	</div>

	<script>
		/* Preload hover image so the swap is instant with no flash */
		(function() {
			const preload = new Image();
			preload.src = 'assets/personal-hover.png';
		})();
	</script>

	<script>
		const resumeEl = document.querySelector(".img2");
		if (resumeEl) {
			resumeEl.addEventListener("click", () => {
				if (window.parent && window.parent !== window && typeof window.parent.openResumeDialog === "function") {
					window.parent.openResumeDialog();
				} else if (window.parent && typeof window.parent.openDialog === "function" && window.parent.resumeDialog) {
					window.parent.openDialog(window.parent.resumeDialog);
				}
			});
		}
	</script>

</body>

</html>
