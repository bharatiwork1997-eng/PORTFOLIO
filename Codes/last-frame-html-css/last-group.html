	<script>
		function checkMobile() {
			try {
				const isMobile = (window.top && window.top.innerWidth <= 768) || (window.parent && window.parent.innerWidth <= 768) || window.innerWidth <= 768;
				document.body.classList.toggle("is-mobile-view", !!isMobile);
			} catch (e) {
				document.body.classList.toggle("is-mobile-view", window.innerWidth <= 768);
			}
		}
		checkMobile();
		window.addEventListener("resize", checkMobile);
		try {
			if (window.parent && window.parent !== window) {
				window.parent.addEventListener("resize", checkMobile);
			}
		} catch (e) {}
	</script>
