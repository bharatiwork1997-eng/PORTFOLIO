<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/fonts.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/sketchbook-group.css?v=10" />
</head>

<body>
	<div class="col">
		<div class="col-top">
			<img src="assets/img9.png" class="img9 sticker-folder" id="sticker-folder" title="Tap to pop stickers!" alt="Pixelated yellow sticker folder" />
			
			<div class="row-top">
				<p class="text-a text1">Sketch</p>
				<p class="text-a text-collage">Collage</p>
			</div>
			
			<div class="row-bottom1">
				<p class="text-b text2">Fun Break · ⌘Z to undo</p>
				<p class="text-b">Tap the folder for stickers</p>
			</div>
		</div>
		
		<div class="row">
			<div class="sketch-wrapper">
				<div class="text-input1 card-light"></div>
				<div class="sketch-tools">
					<button type="button" class="sketch-btn draw-btn active" data-tool="draw">Draw</button>
					<button type="button" class="sketch-btn undo-btn" data-tool="undo-drawing" title="Undo last stroke (⌘Z / Ctrl+Z)">Undo</button>
					<button type="button" class="sketch-btn clear-btn" data-tool="clear-drawing">Clear sketch</button>
				</div>
			</div>
			
			<div class="collage-wrapper">
				<div class="row-right">
					<div class="text-input2 card-light" id="collage-canvas-box"></div>
				</div>

				<div class="collage-tools">
					<button type="button" class="sketch-btn collage-btn" data-tool="sticker">＋ Sticker</button>
					<label class="collage-size-control" for="collage-sticker-size">
						<span>Size</span>
						<input id="collage-sticker-size" type="range" min="60" max="300" value="160">
					</label>
					<button type="button" class="sketch-btn collage-btn" data-tool="clear-collage">Clear collage</button>
					<button type="button" class="sketch-btn collage-btn" data-tool="delete-sticker">Delete sticker</button>
					<button type="button" class="sketch-btn collage-btn" data-tool="download">Download</button>
				</div>
			</div>
		</div>
		
		<div class="row-bottom2">
			<img src="assets/img18.png" class="image img18" />
			<img src="assets/img18.png" class="image img19" />
		</div>
	</div>

	<script>
		// Ensure both sides start completely blank on open
		try {
			localStorage.removeItem("bharati-collage");
			localStorage.removeItem("bharati-sketch");
		} catch (e) {}

		// Pencil texture rendering helpers
		function renderPencilDot(context, x, y) {
			context.save();
			context.fillStyle = "rgba(92, 96, 102, 0.65)";
			context.beginPath();
			context.arc(x, y, 1.8, 0, Math.PI * 2);
			context.fill();

			for (let g = 0; g < 8; g++) {
				const angle = Math.random() * Math.PI * 2;
				const radius = Math.random() * 2.5;
				const alpha = 0.15 + Math.random() * 0.35;
				context.fillStyle = `rgba(120, 124, 130, ${alpha.toFixed(2)})`;
				context.fillRect(
					x + Math.cos(angle) * radius - 0.6,
					y + Math.sin(angle) * radius - 0.6,
					1.2,
					1.2
				);
			}
			context.restore();
		}

		function renderPencilSegment(context, x0, y0, x1, y1) {
			const dx = x1 - x0;
			const dy = y1 - y0;
			const dist = Math.hypot(dx, dy);

			context.save();
			context.lineCap = "round";
			context.lineJoin = "round";
			context.strokeStyle = "rgba(108, 112, 118, 0.45)";
			context.lineWidth = 3.4;
			context.beginPath();
			context.moveTo(x0, y0);
			context.lineTo(x1, y1);
			context.stroke();

			const step = 1.0;
			const steps = Math.min(100, Math.max(1, Math.ceil(dist / step)));
			for (let i = 0; i <= steps; i++) {
				const t = i / steps;
				const cx = x0 + dx * t;
				const cy = y0 + dy * t;

				const jx = (Math.random() - 0.5) * 1.5;
				const jy = (Math.random() - 0.5) * 1.5;
				const coreAlpha = 0.28 + Math.random() * 0.32;
				context.fillStyle = `rgba(92, 96, 102, ${coreAlpha.toFixed(2)})`;
				context.fillRect(cx + jx - 1, cy + jy - 1, 2.2, 2.2);

				const grainCount = 3 + Math.floor(Math.random() * 3);
				for (let g = 0; g < grainCount; g++) {
					const angle = Math.random() * Math.PI * 2;
					const radius = Math.random() * 2.5;
					const grainAlpha = 0.15 + Math.random() * 0.35;
					context.fillStyle = `rgba(120, 124, 130, ${grainAlpha.toFixed(2)})`;
					context.fillRect(
						cx + Math.cos(angle) * radius - 0.6,
						cy + Math.sin(angle) * radius - 0.6,
						1.2,
						1.2
					);
				}
			}
			context.restore();
		}

		// Global action tracker for intelligent undo
		let lastAction = "sketch";
		let undoSketch = () => {};
		let undoCollage = () => {};

		// Initialize Left Canvas (Sketch - 100% blank on open)
		const sketchArea = document.querySelector(".text-input1");
		if (sketchArea && !sketchArea.querySelector("canvas")) {
			sketchArea.style.position = "relative";
			const canvas = document.createElement("canvas");
			canvas.className = "folio-canvas";
			canvas.style.position = "absolute";
			canvas.style.inset = "0";
			canvas.style.width = "100%";
			canvas.style.height = "100%";
			canvas.style.touchAction = "none";
			sketchArea.append(canvas);
			const ctx = canvas.getContext("2d");
			let drawing = false;
			let strokeDrawn = false;
			let lastX = 0;
			let lastY = 0;
			const sketchUndoStack = [];

			function saveSketchSnapshot() {
				try {
					sketchUndoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
					if (sketchUndoStack.length > 50) sketchUndoStack.shift();
				} catch (_) {}
			}

			undoSketch = () => {
				lastAction = "sketch";
				if (sketchUndoStack.length <= 1) {
					sketchUndoStack.length = 0;
					ctx.save();
					ctx.setTransform(1, 0, 0, 1, 0, 0);
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					ctx.restore();
					return;
				}
				sketchUndoStack.pop(); // discard current state
				ctx.save();
				ctx.setTransform(1, 0, 0, 1, 0, 0);
				ctx.putImageData(sketchUndoStack[sketchUndoStack.length - 1], 0, 0);
				ctx.restore();
			};
			window.undoSketch = undoSketch;

			const resize = () => {
				const r = window.devicePixelRatio || 1;
				const w = sketchArea.clientWidth;
				const h = sketchArea.clientHeight;
				if (!w || !h) return;
				const prev = canvas.width && canvas.height ? canvas.toDataURL() : "";
				canvas.width = Math.max(1, Math.round(w * r));
				canvas.height = Math.max(1, Math.round(h * r));
				ctx.setTransform(r, 0, 0, r, 0, 0);
				if (prev) {
					const img = new Image();
					img.onload = () => ctx.drawImage(img, 0, 0, w, h);
					img.src = prev;
				}
			};
			resize();
			window.addEventListener("resize", resize);

			const getPos = (e) => {
				const rect = canvas.getBoundingClientRect();
				return { x: e.clientX - rect.left, y: e.clientY - rect.top };
			};

			canvas.addEventListener("pointerdown", (e) => {
				e.preventDefault();
				drawing = true;
				strokeDrawn = true;
				lastAction = "sketch";
				if (sketchUndoStack.length === 0) {
					saveSketchSnapshot(); // capture blank state as base
				}
				try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
				const pos = getPos(e);
				lastX = pos.x;
				lastY = pos.y;
				renderPencilDot(ctx, lastX, lastY);
			});

			canvas.addEventListener("pointermove", (e) => {
				if (!drawing) return;
				e.preventDefault();
				const pos = getPos(e);
				renderPencilSegment(ctx, lastX, lastY, pos.x, pos.y);
				lastX = pos.x;
				lastY = pos.y;
			});

			const stopDrawing = (e) => {
				if (drawing) {
					drawing = false;
					if (strokeDrawn) {
						saveSketchSnapshot();
						strokeDrawn = false;
					}
					try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
				}
			};
			canvas.addEventListener("pointerup", stopDrawing);
			canvas.addEventListener("pointercancel", stopDrawing);

			const undoBtn = document.querySelector(".undo-btn, [data-tool='undo-drawing']");
			if (undoBtn) {
				undoBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					undoSketch();
				});
			}

			const clearBtn = document.querySelector(".clear-btn, [data-tool='clear-drawing']");
			if (clearBtn) {
				clearBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					saveSketchSnapshot();
					ctx.save();
					ctx.setTransform(1, 0, 0, 1, 0, 0);
					ctx.clearRect(0, 0, canvas.width, canvas.height);
					ctx.restore();
				});
			}

			const drawBtn = document.querySelector(".draw-btn, [data-tool='draw']");
			if (drawBtn) {
				drawBtn.addEventListener("click", (e) => {
					e.stopPropagation();
					drawBtn.classList.add("active");
				});
			}
		}

		// Initialize Right Area (Collage - 100% blank on open)
		const collageArea = document.querySelector(".text-input2");
		let collageLayer = collageArea ? collageArea.querySelector(".collage-layer") : null;
		if (collageArea && !collageLayer) {
			collageLayer = document.createElement("div");
			collageLayer.className = "collage-layer";
			collageLayer.style.position = "absolute";
			collageLayer.style.inset = "0";
			collageLayer.style.overflow = "hidden";
			collageLayer.style.pointerEvents = "none";
			collageArea.append(collageLayer);
		}

		const stickerBank = [
			"img1.png", "img2.png", "img3.png", "img4.png", "img5.png",
			"_7cea1.png", "_7cea2.png", "img6.png", "img7.png", "img8.png",
			"img10.png", "img11.png", "img12.png", "img13.png", "img14.png",
			"img15.png", "img16.png", "text-input.png", "rating.svg"
		].map((f) => `assets/${f}`);

		let stickerIndex = 0;
		let activeSticker = null;
		let maxZIndex = 30;
		const sizeInput = document.querySelector("#collage-sticker-size");

		const collageUndoStack = [];
		undoCollage = () => {
			if (!collageUndoStack.length) return;
			const action = collageUndoStack.pop();
			if (action.type === "add" && action.sticker && action.sticker.isConnected) {
				action.sticker.remove();
				activeSticker = collageLayer ? collageLayer.lastElementChild : null;
				if (activeSticker) selectSticker(activeSticker);
			} else if (action.type === "delete" && action.sticker) {
				collageLayer.append(action.sticker);
				selectSticker(action.sticker);
			}
		};
		window.undoCollage = undoCollage;

		function selectSticker(sticker) {
			if (collageLayer) {
				collageLayer.querySelectorAll(".collage-sticker").forEach((s) => {
					s.classList.toggle("is-selected", s === sticker);
				});
			}
			activeSticker = sticker;
			if (activeSticker && sizeInput) {
				const currentW = Math.round(parseFloat(activeSticker.style.width) || 160);
				sizeInput.value = currentW;
			}
		}

		function addSticker() {
			if (!collageLayer) return;
			lastAction = "collage";

			// Folder pop animation
			const folder = document.querySelector(".img9, #sticker-folder");
			if (folder) {
				folder.classList.remove("is-popping");
				void folder.offsetWidth;
				folder.classList.add("is-popping");
			}

			const src = stickerBank[stickerIndex % stickerBank.length];
			stickerIndex++;

			const size = Number(sizeInput ? sizeInput.value : 160);
			const img = document.createElement("img");
			img.src = src;
			img.className = "collage-sticker popping";
			img.alt = "Collage sticker";
			img.draggable = false;
			img.style.position = "absolute";
			img.style.touchAction = "none";
			img.style.userSelect = "none";
			img.style.webkitUserSelect = "none";
			img.style.pointerEvents = "auto";
			img.style.zIndex = String(++maxZIndex);
			img.style.width = `${size}px`;
			img.style.height = "auto";

			const areaW = collageArea.clientWidth || 520;
			const areaH = collageArea.clientHeight || 480;
			const posX = Math.max(16, Math.min(areaW - size - 16, (areaW * 0.5) - (size * 0.5) + (Math.random() * 50 - 25)));
			const posY = Math.max(18, Math.min(areaH - size - 18, (areaH * 0.22) + (Math.random() * 40 - 20)));
			img.style.left = `${posX}px`;
			img.style.top = `${posY}px`;

			// Draggable pointer interactions
			let internalTouch = null;
			img.addEventListener("touchstart", (e) => {
				e.preventDefault();
				e.stopPropagation();
				lastAction = "collage";
				img.classList.remove("popping");
				selectSticker(img);
				img.style.zIndex = String(++maxZIndex);

				if (e.touches.length === 1) {
					const t = e.touches[0];
					internalTouch = {
						mode: "drag",
						startX: t.clientX,
						startY: t.clientY,
						initX: parseFloat(img.style.left) || 0,
						initY: parseFloat(img.style.top) || 0
					};
				} else if (e.touches.length >= 2) {
					const t1 = e.touches[0];
					const t2 = e.touches[1];
					internalTouch = {
						mode: "pinch",
						initialDist: Math.max(10, Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY)),
						initialWidth: parseFloat(img.style.width) || size,
						initialLeft: parseFloat(img.style.left) || 0,
						initialTop: parseFloat(img.style.top) || 0,
						initialMidX: (t1.clientX + t2.clientX) / 2,
						initialMidY: (t1.clientY + t2.clientY) / 2
					};
				}
			}, { passive: false });

			img.addEventListener("touchmove", (e) => {
				if (!internalTouch) return;
				e.preventDefault();
				e.stopPropagation();

				if (e.touches.length >= 2) {
					const t1 = e.touches[0];
					const t2 = e.touches[1];
					const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
					const midX = (t1.clientX + t2.clientX) / 2;
					const midY = (t1.clientY + t2.clientY) / 2;

					if (internalTouch.mode !== "pinch") {
						internalTouch = {
							mode: "pinch",
							initialDist: Math.max(10, dist),
							initialWidth: parseFloat(img.style.width) || size,
							initialLeft: parseFloat(img.style.left) || 0,
							initialTop: parseFloat(img.style.top) || 0,
							initialMidX: midX,
							initialMidY: midY
						};
						return;
					}

					const ratio = dist / internalTouch.initialDist;
					const newW = Math.round(Math.max(40, Math.min(480, internalTouch.initialWidth * ratio)));
					const deltaW = newW - internalTouch.initialWidth;
					const aspect = (img.naturalHeight || 1) / (img.naturalWidth || 1);
					const deltaH = deltaW * aspect;

					const deltaMidX = midX - internalTouch.initialMidX;
					const deltaMidY = midY - internalTouch.initialMidY;

					img.style.width = `${newW}px`;
					img.style.left = `${internalTouch.initialLeft + deltaMidX - (deltaW / 2)}px`;
					img.style.top = `${internalTouch.initialTop + deltaMidY - (deltaH / 2)}px`;
					if (sizeInput) sizeInput.value = newW;
				} else if (e.touches.length === 1 && internalTouch.mode === "drag") {
					const t = e.touches[0];
					img.style.left = `${internalTouch.initX + (t.clientX - internalTouch.startX)}px`;
					img.style.top = `${internalTouch.initY + (t.clientY - internalTouch.startY)}px`;
				}
			}, { passive: false });

			img.addEventListener("touchend", (e) => {
				if (e.touches.length === 0) {
					internalTouch = null;
				}
			}, { passive: true });

			img.addEventListener("pointerdown", (e) => {
				if (e.pointerType === "touch") return;
				e.preventDefault();
				e.stopPropagation();
				lastAction = "collage";
				img.classList.remove("popping");
				selectSticker(img);
				img.style.zIndex = String(++maxZIndex);

				try { img.setPointerCapture(e.pointerId); } catch (_) {}

				const startX = e.clientX;
				const startY = e.clientY;
				const initX = parseFloat(img.style.left) || 0;
				const initY = parseFloat(img.style.top) || 0;

				const onMove = (me) => {
					me.preventDefault();
					const curW = parseFloat(img.style.width) || size;
					const curH = img.clientHeight || curW;
					const minX = -curW * 0.75;
					const maxX = (collageArea.clientWidth || 520) - (curW * 0.25);
					const minY = -curH * 0.75;
					const maxY = (collageArea.clientHeight || 480) - (curH * 0.25);

					const nextX = initX + (me.clientX - startX);
					const nextY = initY + (me.clientY - startY);
					img.style.left = `${Math.max(minX, Math.min(maxX, nextX))}px`;
					img.style.top = `${Math.max(minY, Math.min(maxY, nextY))}px`;
				};

				const onUp = (ue) => {
					try { img.releasePointerCapture(ue.pointerId); } catch (_) {}
					img.removeEventListener("pointermove", onMove);
					img.removeEventListener("pointerup", onUp);
					img.removeEventListener("pointercancel", onUp);
				};

				img.addEventListener("pointermove", onMove);
				img.addEventListener("pointerup", onUp);
				img.addEventListener("pointercancel", onUp);
			});

			img.addEventListener("click", (e) => {
				e.stopPropagation();
				lastAction = "collage";
				selectSticker(img);
			});

			collageLayer.append(img);
			collageUndoStack.push({ type: "add", sticker: img });
			selectSticker(img);
			setTimeout(() => img.classList.remove("popping"), 400);
		}

		window.addStickerStandalone = addSticker;

		// Button listeners
		const stickerBtn = document.querySelector(".collage-tools [data-tool='sticker']");
		if (stickerBtn) {
			stickerBtn.addEventListener("click", (e) => {
				e.stopPropagation();
				addSticker();
			});
		}

		const folder = document.querySelector(".img9, #sticker-folder");
		if (folder) {
			folder.addEventListener("click", (e) => {
				e.stopPropagation();
				addSticker();
			});
		}

		if (sizeInput) {
			sizeInput.addEventListener("input", () => {
				if (activeSticker) {
					activeSticker.style.width = `${sizeInput.value}px`;
				}
			});
		}

		const clearCollageBtn = document.querySelector(".collage-tools [data-tool='clear-collage']");
		if (clearCollageBtn) {
			clearCollageBtn.addEventListener("click", (e) => {
				e.stopPropagation();
				if (collageLayer) collageLayer.replaceChildren();
				activeSticker = null;
			});
		}

		function deleteActiveSticker() {
			let target = null;
			if (activeSticker && activeSticker.isConnected) {
				target = activeSticker;
			} else if (collageLayer && collageLayer.lastElementChild) {
				target = collageLayer.lastElementChild;
			}
			if (target) {
				lastAction = "collage";
				collageUndoStack.push({ type: "delete", sticker: target });
				target.remove();
				activeSticker = collageLayer ? collageLayer.lastElementChild : null;
				if (activeSticker) selectSticker(activeSticker);
			}
		}

		const deleteBtn = document.querySelector(".collage-tools [data-tool='delete-sticker']");
		if (deleteBtn) {
			deleteBtn.addEventListener("click", (e) => {
				e.stopPropagation();
				deleteActiveSticker();
			});
		}

		window.addEventListener("keydown", (e) => {
			const isZ = e.key === "z" || e.key === "Z" || e.code === "KeyZ";
			if (isZ && (e.metaKey || e.ctrlKey)) {
				e.preventDefault();
				if (lastAction === "collage" && collageUndoStack.length) {
					undoCollage();
				} else {
					undoSketch();
				}
				return;
			}
			const isDeleteKey = e.key === "Delete" || e.key === "Backspace" || e.key === "Del" || e.code === "Delete" || e.code === "Backspace" || e.code === "NumpadDecimal";
			if (isDeleteKey) {
				if (e.target.tagName === "INPUT" && e.target.type !== "range") return;
				e.preventDefault();
				deleteActiveSticker();
			}
		});

		// Download collage as image
		const downloadBtn = document.querySelector(".collage-tools [data-tool='download']");
		if (downloadBtn) {
			downloadBtn.addEventListener("click", async (e) => {
				e.stopPropagation();
				if (!collageLayer || !collageLayer.children.length) {
					alert("Add at least one sticker to the collage before downloading!");
					return;
				}
				try {
					const board = document.querySelector(".text-input2") || collageLayer;
					const rect = board.getBoundingClientRect();
					const canvas = document.createElement("canvas");
					const dpr = 2;
					canvas.width = (rect.width || 520) * dpr;
					canvas.height = (rect.height || 480) * dpr;
					const c = canvas.getContext("2d");
					c.scale(dpr, dpr);
					c.fillStyle = "#faf8f4";
					c.fillRect(0, 0, rect.width || 520, rect.height || 480);

					const stickers = [...collageLayer.querySelectorAll(".collage-sticker")];
					for (const s of stickers) {
						const sx = parseFloat(s.style.left) || 0;
						const sy = parseFloat(s.style.top) || 0;
						const sw = parseFloat(s.style.width) || s.clientWidth || 100;
						const sh = s.clientHeight || sw;
						await new Promise((res) => {
							if (s.complete && s.naturalWidth) {
								c.drawImage(s, sx, sy, sw, sh);
								res();
							} else {
								const temp = new Image();
								temp.onload = () => { c.drawImage(temp, sx, sy, sw, sh); res(); };
								temp.onerror = res;
								temp.src = s.src;
							}
						});
					}
					const link = document.createElement("a");
					link.download = "bharati-collage.png";
