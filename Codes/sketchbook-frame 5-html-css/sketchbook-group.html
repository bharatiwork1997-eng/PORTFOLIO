<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/fonts.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/sketchbook-group.css?v=5" />
</head>

<body>
	<div class="col">
		<div class="col-top">
			<img src="assets/img9.png" class="img9 sticker-folder" id="sticker-folder" title="Tap to pop stickers!" alt="Pixelated yellow sticker folder" />
			
			<div class="row-top">
				<p class="text-a text1">Sketch</p>
				<p class="text-a text-collage">Collage</p>
			</div>
			
			<div class="row-bottom1">
				<p class="text-b text2">Fun Break</p>
				<p class="text-b">Tap the folder for stickers</p>
			</div>
		</div>
		
		<div class="row">
			<div class="sketch-wrapper">
				<div class="text-input1 card-light"></div>
				<div class="sketch-tools">
					<button type="button" class="sketch-btn draw-btn active" data-tool="draw">Draw</button>
					<button type="button" class="sketch-btn clear-btn" data-tool="clear-drawing">Clear sketch</button>
				</div>
			</div>
			
			<div class="collage-wrapper">
				<div class="row-right">
					<div class="text-input2 card-light" id="collage-canvas-box"></div>
				</div>

				<div class="collage-tools">
					<button type="button" class="sketch-btn collage-btn" data-tool="sticker">＋ Sticker</button>
					<label class="collage-size-control" for="collage-sticker-size">
						<span>Size</span>
						<input id="collage-sticker-size" type="range" min="48" max="180" value="92">
					</label>
					<button type="button" class="sketch-btn collage-btn" data-tool="clear-collage">Clear collage</button>
					<button type="button" class="sketch-btn collage-btn" data-tool="save">Save</button>
					<button type="button" class="sketch-btn collage-btn" data-tool="download">Download</button>
					<button type="button" class="sketch-btn collage-btn" data-tool="share">Share</button>
				</div>
			</div>
		</div>
		
		<div class="row-bottom2">
			<img src="assets/img18.png" class="image img18" />
			<img src="assets/img18.png" class="image img19" />
		</div>
	</div>

	<script>
		if (window.self === window.top) {
			const sketchArea = document.querySelector(".text-input1");
			if (sketchArea && !sketchArea.querySelector("canvas")) {
				sketchArea.style.position = "relative";
				const canvas = document.createElement("canvas");
				canvas.style.position = "absolute";
				canvas.style.inset = "0";
				canvas.style.width = "100%";
				canvas.style.height = "100%";
				canvas.style.cursor = "crosshair";
				sketchArea.append(canvas);
				const ctx = canvas.getContext("2d");
				let drawing = false;
				const resize = () => {
					const prev = canvas.width ? canvas.toDataURL() : "";
					const r = window.devicePixelRatio || 1;
					const w = sketchArea.clientWidth;
					const h = sketchArea.clientHeight;
					canvas.width = Math.max(1, Math.round(w * r));
					canvas.height = Math.max(1, Math.round(h * r));
					ctx.setTransform(r, 0, 0, r, 0, 0);
					ctx.lineCap = "round";
					ctx.lineJoin = "round";
					ctx.strokeStyle = "#c7484b";
					ctx.lineWidth = 4;
					if (prev) { const img = new Image(); img.onload = () => ctx.drawImage(img, 0, 0, w, h); img.src = prev; }
				};
				resize();
				window.addEventListener("resize", resize);
				canvas.addEventListener("pointerdown", (e) => {
					drawing = true;
					canvas.setPointerCapture(e.pointerId);
					ctx.beginPath();
					ctx.moveTo(e.offsetX, e.offsetY);
				});
				canvas.addEventListener("pointermove", (e) => {
					if (!drawing) return;
					ctx.lineTo(e.offsetX, e.offsetY);
					ctx.stroke();
				});
				canvas.addEventListener("pointerup", () => { drawing = false; });
				canvas.addEventListener("pointercancel", () => { drawing = false; });
				const clearBtn = document.querySelector(".clear-btn");
				if (clearBtn) clearBtn.addEventListener("click", () => ctx.clearRect(0, 0, canvas.width, canvas.height));
			}

			const collageArea = document.querySelector(".text-input2");
			if (collageArea && !collageArea.querySelector(".collage-layer")) {
				const layer = document.createElement("div");
				layer.style.position = "absolute";
				layer.style.inset = "0";
				layer.style.overflow = "hidden";
				layer.className = "collage-layer";
				collageArea.append(layer);
				const stickerBank = [
					"img1.png", "img2.png", "img3.png", "img4.png", "img5.png",
					"_7cea1.png", "_7cea2.png", "img6.png", "img7.png", "img8.png",
					"img10.png", "img11.png", "img12.png", "img13.png", "img14.png",
					"img15.png", "img16.png", "text-input.png", "rating.svg"
				].map((f) => `assets/${f}`);
				let stickerIndex = 0;
				let activeSticker = null;
				const sizeInput = document.querySelector("#collage-sticker-size");
				const addStickerStandalone = () => {
					const folder = document.querySelector(".img9");
					if (folder) {
						folder.classList.remove("is-popping");
						void folder.offsetWidth;
						folder.classList.add("is-popping");
					}
					const src = stickerBank[stickerIndex % stickerBank.length];
					stickerIndex++;
					const size = Number(sizeInput ? sizeInput.value : 92);
					const img = document.createElement("img");
					img.src = src;
					img.className = "collage-sticker popping";
					img.style.position = "absolute";
					img.style.left = `${Math.max(16, Math.min(collageArea.clientWidth - size - 16, (collageArea.clientWidth * 0.5) + (Math.random() * 50 - 25)))}px`;
					img.style.top = `${18 + (Math.random() * 30)}px`;
					img.style.width = `${size}px`;
					img.style.cursor = "grab";
					img.style.zIndex = "40";
					img.addEventListener("pointerdown", (e) => {
						e.preventDefault();
						img.classList.remove("popping");
						activeSticker = img;
						img.style.cursor = "grabbing";
						const startX = e.clientX;
						const startY = e.clientY;
						const initX = Number.parseFloat(img.style.left) || 0;
						const initY = Number.parseFloat(img.style.top) || 0;
						const onMove = (me) => {
							img.style.left = `${Math.max(0, Math.min(collageArea.clientWidth - 30, initX + (me.clientX - startX)))}px`;
							img.style.top = `${Math.max(0, Math.min(collageArea.clientHeight - 30, initY + (me.clientY - startY)))}px`;
						};
						const onUp = () => {
							img.style.cursor = "grab";
							document.removeEventListener("pointermove", onMove);
							document.removeEventListener("pointerup", onUp);
						};
						document.addEventListener("pointermove", onMove);
						document.addEventListener("pointerup", onUp);
					});
					layer.append(img);
					activeSticker = img;
				};
				const stickerBtn = document.querySelector(".collage-tools [data-tool='sticker']");
				if (stickerBtn) stickerBtn.addEventListener("click", addStickerStandalone);
				if (sizeInput) sizeInput.addEventListener("input", () => {
					if (activeSticker) activeSticker.style.width = `${sizeInput.value}px`;
				});
				const clearCollageBtn = document.querySelector(".collage-tools [data-tool='clear-collage']");
				if (clearCollageBtn) clearCollageBtn.addEventListener("click", () => layer.replaceChildren());
				const folder = document.querySelector(".img9");
				if (folder) folder.addEventListener("click", addStickerStandalone);
			}
		}
	</script>
</body>

</html>
