<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<title>Agency Work — Beauty Brands | Bharati Kamble</title>
	
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/detailed-page.css?v=11" />
	<link rel="preload" as="image" href="assets/pencil-cursor.png" fetchpriority="high" />

</head>

<body>
	<div class="pencil-cursor" aria-hidden="true"><img src="assets/pencil-cursor.png" alt="" loading="eager" fetchpriority="high" decoding="sync"></div>
	<main class="page-container">
		<div class="assessment-sheet agency-sheet">
			<div class="dialog-top-actions">
				<a class="dialog-close" href="../index.html" aria-label="Back to portfolio"><svg class="pixel-cross-icon" width="14" height="14" viewBox="0 0 14 14" fill="currentColor" shape-rendering="crispEdges" aria-hidden="true"><rect x="0" y="0" width="2" height="2"/><rect x="12" y="0" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="10" y="2" width="2" height="2"/><rect x="4" y="4" width="2" height="2"/><rect x="8" y="4" width="2" height="2"/><rect x="6" y="6" width="2" height="2"/><rect x="4" y="8" width="2" height="2"/><rect x="8" y="8" width="2" height="2"/><rect x="2" y="10" width="2" height="2"/><rect x="10" y="10" width="2" height="2"/><rect x="0" y="12" width="2" height="2"/><rect x="12" y="12" width="2" height="2"/></svg></a>
			</div>
			
			<div class="assessment-header">
				<h1 id="assessment-title">Beauty Brands</h1>
			</div>

			<!-- Interactive Category Navigation -->
			<div class="assessment-nav agency-nav" role="tablist">
				<button class="assessment-tab is-active" type="button" data-agency-nav="all" role="tab" aria-selected="true">
					<span class="tab-icon">✨</span> All
				</button>
				<button class="assessment-tab" type="button" data-agency-nav="pitches" role="tab" aria-selected="false">
					<span class="tab-icon">🎯</span> Pitches
				</button>
				<div class="agency-subnav-group">
					<button class="assessment-tab" type="button" data-agency-nav="social-media" role="tab" aria-selected="false">
						<span class="tab-icon">📱</span> Social Media
					</button>
					<span class="agency-nav-sep" aria-hidden="true">:</span>
					<button class="agency-subtab" type="button" data-agency-nav="smashbox" title="View Smashbox">Smashbox</button>
					<button class="agency-subtab" type="button" data-agency-nav="tira" title="View Tira">Tira</button>
					<button class="agency-subtab" type="button" data-agency-nav="bobbi-brown" title="View Bobbi Brown">Bobbi Brown</button>
				</div>
			</div>

			<!-- Seamless Long-Scroll View -->
			<div class="assessment-panel is-active" id="panel-campaigns" role="tabpanel">
				<div class="pdf-scroll-container">
					<div class="pdf-scroll-viewport" id="assessment-scroll-viewport" tabindex="0" role="region" aria-label="Beauty Brands Work Document">
						<div class="pdf-scroll-track" id="assessment-scroll-track">
							<!-- 1. Pitches -->
							<div class="agency-slice-item" id="pitches">
								<img src="assets/agency/Pitches.jpg" alt="Beauty Brands - Pitches &amp; Key Visuals" loading="eager" draggable="false">
							</div>

							<!-- 2. Social Media -->
							<div class="agency-slice-item" id="social-media">
								<!-- Smashbox -->
								<div class="agency-brand-item" id="smashbox">
									<img src="assets/agency/Social Media - Smashbox 1.jpg" alt="Smashbox x Nykaaland - Photo Finish Primer" loading="eager" draggable="false">
									<img src="assets/agency/Social Media - Smashbox 2.jpg" alt="Smashbox Halo Franchise &amp; Festive Diwali" loading="lazy" draggable="false">
								</div>

								<!-- Tira -->
								<div class="agency-brand-item" id="tira">
									<img src="assets/agency/Social Media - Tira 1.jpg" alt="Tira Launches - Christmas &amp; Flagship" loading="lazy" draggable="false">
									<img src="assets/agency/Social Media - Tira 2.jpg" alt="Tira Moodboards &amp; Editorial Collages" loading="lazy" draggable="false">
								</div>

								<!-- Bobbi Brown -->
								<div class="agency-brand-item" id="bobbi-brown">
									<img src="assets/agency/Social Media - Bobbi brown.jpg" alt="Bobbi Brown - Vitamin Enriched &amp; Lip Serum" loading="lazy" draggable="false">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="assessment-footer">
				<a class="story-back" href="../index.html">Back to the sketchbook <span aria-hidden="true">↗</span></a>
			</div>
			<div class="sheet-corner-fold" aria-hidden="true"></div>
		</div>
	</main>

	<script>
		const viewport = document.querySelector("#assessment-scroll-viewport");
		const progressBar = document.querySelector("#pdf-progress-bar");
		const percentText = document.querySelector("#pdf-percent-text");
		const topBtn = document.querySelector("#pdf-scroll-top-btn");

		function updateProgress() {
			if (!viewport) return;
			const maxScroll = viewport.scrollHeight - viewport.clientHeight;
			if (maxScroll <= 0) return;
			const pct = Math.min(100, Math.max(0, Math.round((viewport.scrollTop / maxScroll) * 100)));
			if (progressBar) progressBar.style.width = `${pct}%`;
			if (percentText) percentText.textContent = `${pct}%`;
		}

		if (viewport) {
			viewport.addEventListener("scroll", updateProgress, { passive: true });

			let isDown = false;
			let startY = 0;
			let initialScroll = 0;

			viewport.addEventListener("mousedown", (e) => {
				isDown = true;
				viewport.classList.add("is-dragging");
				startY = e.pageY;
				initialScroll = viewport.scrollTop;
			});

			window.addEventListener("mouseup", () => {
				if (isDown) {
					isDown = false;
					viewport.classList.remove("is-dragging");
				}
			});

			window.addEventListener("mousemove", (e) => {
				if (!isDown) return;
				e.preventDefault();
				const walk = (e.pageY - startY) * 1.5;
				viewport.scrollTop = initialScroll - walk;
			});

			if (topBtn) {
				topBtn.addEventListener("click", () => {
					viewport.scrollTo({ top: 0, behavior: "smooth" });
				});
			}

			updateProgress();
		}

		// Agency category & brand navigation
		const agencyNavBtns = document.querySelectorAll("[data-agency-nav]");

		function setAgencyActiveNav(target) {
			agencyNavBtns.forEach((btn) => {
				const isTarget = btn.dataset.agencyNav === target;
				btn.classList.toggle("is-active", isTarget);
				btn.setAttribute("aria-selected", isTarget ? "true" : "false");
			});
			if (["smashbox", "tira", "bobbi-brown"].includes(target)) {
				const smTab = document.querySelector('[data-agency-nav="social-media"]');
				if (smTab) smTab.classList.add("is-active");
			}
		}

		agencyNavBtns.forEach((btn) => {
			btn.addEventListener("click", (e) => {
				e.preventDefault();
				const target = btn.dataset.agencyNav;
				setAgencyActiveNav(target);

				if (target === "all") {
					viewport.scrollTo({ top: 0, behavior: "smooth" });
					return;
				}

				const targetEl = document.getElementById(target);
				if (targetEl) {
					const offset = targetEl.offsetTop;
					viewport.scrollTo({ top: Math.max(0, offset - 6), behavior: "smooth" });
				}
			});
		});

		function updateAgencyActiveOnScroll() {
			if (viewport.scrollTop < 60) {
				setAgencyActiveNav("all");
				return;
			}
			const currentPos = viewport.scrollTop + 80;
			const checkTargets = [
				{ id: "bobbi-brown", key: "bobbi-brown" },
				{ id: "tira", key: "tira" },
				{ id: "smashbox", key: "smashbox" },
				{ id: "social-media", key: "social-media" },
				{ id: "pitches", key: "pitches" }
			];
			for (const item of checkTargets) {
				const el = document.getElementById(item.id);
				if (el && el.offsetTop <= currentPos) {
					setAgencyActiveNav(item.key);
					return;
				}
			}
			setAgencyActiveNav("all");
		}

		viewport.addEventListener("scroll", updateAgencyActiveOnScroll, { passive: true });

		/* Fullscreen toggle */
		function togglePageFullscreen() {
			const isFS = document.body.classList.contains("is-fullscreen");
			if (!isFS) {
				document.body.classList.add("is-fullscreen");
				if (document.documentElement.requestFullscreen) {
					document.documentElement.requestFullscreen().catch(() => {});
				}
			} else {
				document.body.classList.remove("is-fullscreen");
				if (document.fullscreenElement) {
					document.exitFullscreen().catch(() => {});
				}
			}
			updatePageFullscreenUI();
		}

		function updatePageFullscreenUI() {
			const isFS = document.body.classList.contains("is-fullscreen") || !!document.fullscreenElement;
			document.body.classList.toggle("is-fullscreen", isFS);

			document.querySelectorAll(".fullscreen-toggle-btn").forEach((btn) => {
				btn.classList.toggle("is-active", isFS);
				btn.setAttribute("title", isFS ? "Exit Full Screen (Esc / F)" : "Toggle full screen (F)");
				const label = btn.querySelector(".action-btn-label");
				if (label) label.textContent = isFS ? "Exit Full Screen" : "Full Screen";
				const expandIcon = btn.querySelector(".fs-icon-expand");
				const compressIcon = btn.querySelector(".fs-icon-compress");
				if (expandIcon) expandIcon.style.display = isFS ? "none" : "block";
				if (compressIcon) compressIcon.style.display = isFS ? "block" : "none";
			});

			document.querySelectorAll(".pdf-fullscreen-btn").forEach((btn) => {
				btn.classList.toggle("is-active", isFS);
				btn.setAttribute("title", isFS ? "Exit full screen view (Esc / F)" : "View full screen (F)");
				const textSpan = btn.querySelector(".pdf-fs-text");
				if (textSpan) {
					textSpan.textContent = isFS ? "Exit Full Screen" : "Full Screen";
				}
			});

			setTimeout(updateProgress, 120);
		}

		document.querySelectorAll("#page-fullscreen-toggle, #toolbar-fullscreen-btn").forEach((btn) => {
			btn.addEventListener("click", togglePageFullscreen);
		});

		document.addEventListener("fullscreenchange", () => {
			if (!document.fullscreenElement && document.body.classList.contains("is-fullscreen")) {
				document.body.classList.remove("is-fullscreen");
			}
			updatePageFullscreenUI();
		});

		document.addEventListener("keydown", (e) => {
			if ((e.key === "f" || e.key === "F") && !e.ctrlKey && !e.metaKey && !e.altKey) {
				if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
				e.preventDefault();
				togglePageFullscreen();
			}
		});

		const pencil = document.querySelector(".pencil-cursor");
		let pencilTargetX = -200, pencilTargetY = -200, pencilVisible = false, pencilRaf = false;
		function renderPencil() {
			pencilRaf = false;
			if (pencil) pencil.style.transform = `translate3d(${pencilTargetX}px, ${pencilTargetY}px, 0) translate(-12.9px, -3.3px) rotate(-26deg)`;
		}
		function movePencil(e) {
			if (!pencil || matchMedia("(hover: none)").matches || matchMedia("(pointer: coarse)").matches || window.innerWidth <= 768) return;
			pencilTargetX = e.clientX;
			pencilTargetY = e.clientY;
			if (!pencilVisible) {
				pencilVisible = true;
				pencil.style.display = "block";
			}
			if (!pencilRaf) {
				pencilRaf = true;
				requestAnimationFrame(renderPencil);
			}
		}
		function hidePencil() {
			pencilVisible = false;
			if (pencil) pencil.style.display = "none";
		}
		document.addEventListener("pointermove", movePencil, { passive: true });
		document.addEventListener("pointerenter", movePencil, { passive: true });
		document.addEventListener("pointerleave", hidePencil);
	</script>
</body>
</html>
