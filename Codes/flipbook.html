<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#171713">
	<title>Sketchbook Flipbook</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="flipbook.css?v=3">
	<style>
		@font-face {
			font-family: "Geist Pixel";
			src: url("welcoming-screen-html-css/fonts/geist-pixel-regular-variable-font-elsh.ttf") format("truetype");
			font-weight: 100 900;
			font-display: swap;
		}
		/* Same tokens as portfolio.css */
		:root {
			color-scheme: dark;
			--ink: #f2eee6;
			--paper: #f5f1e8;
			--muted: #aaa69d;
			--line: rgba(241, 235, 221, .25);
			--accent: #f18b85;
			--pixel: "Geist Pixel", "Courier New", monospace;
			--inter: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--page-ink: #262626;
			--page-ink-soft: #4a4540;
			--flame: #ff5238;
			--fb-flap-fold: #d6cfc2;
			--fb-flap-mid: #ece6da;
			--fb-flap-edge: #fbf8f1;
		}
		* { box-sizing: border-box; }
		html, body { margin: 0; height: 100%; }
		body {
			background: #000;
			color: var(--ink);
			font-family: var(--pixel);
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		button { font: inherit; color: inherit; }
		:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

		.top {
			display: flex;
			justify-content: space-between;
			align-items: center;
			gap: 16px;
			padding: 18px 24px 0;
			font-size: 15px;
		}
		.top a { color: var(--ink); text-decoration: none; }
		.top a:hover { color: #fff; }
		.top p { margin: 0; color: var(--muted); }

		.stage {
			flex: 1;
			min-height: 0;
			display: grid;
			place-items: center;
			padding: 16px;
		}
		.book {
			position: relative;
			touch-action: pan-y;
			user-select: none;
			-webkit-user-select: none;
			filter: drop-shadow(0 24px 34px rgba(0, 0, 0, .45));
		}
		.scene {
			position: absolute;
			left: 0;
			top: 0;
			height: 760px;
			transform-origin: top left;
		}

		.view { position: absolute; left: 0; top: 0; height: 760px; visibility: hidden; z-index: 1; }
		.view.is-active { visibility: visible; z-index: 2; }
		.fb-face__host .view { visibility: visible; }

		/* Pages */
		.page {
			position: absolute;
			top: 0;
			width: 560px;
			height: 760px;
			padding: 64px 56px 56px;
			display: flex;
			flex-direction: column;
			gap: 22px;
			color: var(--page-ink);
			background:
				radial-gradient(circle, rgba(38, 38, 38, .2) 1.2px, transparent 1.7px) 0 0 / 22px 22px,
				var(--paper);
			overflow: hidden;
		}
		.page--left { left: 0; border-radius: 6px 0 0 6px; box-shadow: inset -26px 0 30px -22px rgba(0, 0, 0, .35); }
		.page--right { left: 560px; border-radius: 0 6px 6px 0; box-shadow: inset 26px 0 30px -22px rgba(0, 0, 0, .35); }
		.page--single { left: 0; border-radius: 0 6px 6px 0; box-shadow: inset 22px 0 26px -20px rgba(0, 0, 0, .35); }
		.page:focus-visible { outline-offset: -6px; }

		.page__num { font-size: 15px; letter-spacing: 1px; color: var(--page-ink-soft); }
		.page__title {
			margin: 0;
			font-family: var(--pixel);
			font-weight: 400;
			font-size: 56px;
			line-height: .98;
			letter-spacing: -.5px;
			transform: rotate(-1.6deg);
			transform-origin: left center;
		}
		.page__squiggle { width: 190px; height: 18px; margin-top: -10px; color: var(--accent); }
		.page__art { flex: 1; min-height: 0; display: grid; place-items: center; }
		.page__art svg, .page__art img { width: 100%; max-width: 380px; max-height: 100%; height: auto; }
		.page__body {
			margin: 0;
			font-family: var(--inter);
			font-size: 19px;
			line-height: 1.5;
			color: var(--page-ink-soft);
			max-width: 30ch;
		}

		.page--cover {
			background:
				radial-gradient(circle, rgba(38, 38, 38, .16) 1.2px, transparent 1.7px) 0 0 / 22px 22px,
				var(--accent);
			justify-content: space-between;
		}
		.page--cover .page__title { font-size: 76px; }
		.page--cover .page__squiggle { color: var(--page-ink); }
		.page--cover .page__body { color: var(--page-ink); }
		.page--end { justify-content: center; text-align: center; align-items: center; }
		.page--end .page__title { font-size: 72px; transform: rotate(1.5deg); transform-origin: center; }
		.page--end .page__art { flex: 0 0 auto; width: 260px; }

		/* Controls */
		.controls {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 28px;
			padding: 0 16px 20px;
			font-size: 15px;
			color: #d5cec2;
		}
		.controls button {
			border: 0;
			background: transparent;
			padding: 8px 4px;
			cursor: pointer;
			transition: color 180ms ease;
		}
		.controls button:hover { color: #fff; }
		.controls button:disabled { opacity: .25; cursor: default; }
		.counter { min-width: 120px; text-align: center; }
		.hint { margin: 0; text-align: center; color: var(--muted); font-family: var(--inter); font-size: 13px; padding-bottom: 14px; }

		.sr-only {
			position: absolute !important;
			width: 1px; height: 1px; padding: 0; margin: -1px;
			overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
		}

		@media (max-width: 600px) {
			.top { padding: 14px 16px 0; font-size: 13px; }
			.top p { display: none; }
			.stage { padding: 12px 16px; }
			.hint { display: none; }
		}
	</style>
</head>
<body>
	<header class="top">
		<a href="index.html">← Portfolio</a>
		<p>Flipbook</p>
	</header>

	<main class="stage" id="stage">
		<div class="book" id="book" role="region" aria-roledescription="book" aria-label="Sketchbook flipbook">
			<div class="scene" id="scene"></div>
		</div>
	</main>

	<nav class="controls" aria-label="Book navigation">
		<button type="button" id="prev">← Previous</button>
		<span class="counter" id="counter" aria-hidden="true"></span>
		<button type="button" id="next">Next →</button>
	</nav>
	<p class="hint">Drag a page corner, click a page edge, or use the arrow keys.</p>
	<p class="sr-only" id="status" aria-live="polite" aria-atomic="true"></p>

	<svg width="0" height="0" style="position:absolute" aria-hidden="true">
		<symbol id="squiggle" viewBox="0 0 190 18"><path d="M3 11c14-9 22 6 36-2s20-8 32 0 22 6 34-2 22-7 34 1 20 6 32-1 12-4 16-2" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></symbol>
	</svg>

	<script src="flipbook-pages.js?v=1"></script>
	<script src="flipbook.js?v=9"></script>
	<script>
	(function () {
		"use strict";
		const PAGE_W = 560, PAGE_H = 760, SPREAD_W = PAGE_W * 2;
		const pages = window.FLIPBOOK_PAGES || [];
		const art = window.FLIPBOOK_ILLUSTRATIONS || {};
		const book = document.getElementById("book");
		const scene = document.getElementById("scene");
		const stage = document.getElementById("stage");
		const prev = document.getElementById("prev");
		const next = document.getElementById("next");
		const counter = document.getElementById("counter");
		const status = document.getElementById("status");

		let mode = null;       // "spread" | "single"
		let views = [];        // [{ el, pages: [pageIndex|null, pageIndex|null] }]
		let index = 0;

		const escapeHTML = (str) => String(str ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

		function illustration(value) {
			if (!value) return "";
			if (art[value]) return art[value];
			if (/^\s*<svg[\s>]/i.test(value)) return value;
			return `<img src="${escapeHTML(value)}" alt="">`;
		}

		function renderPage(n, side) {
			const page = pages[n];
			const el = document.createElement("article");
			el.className = `page page--${side}${page.kind ? ` page--${page.kind}` : ""}`;
			el.tabIndex = 0;
			el.setAttribute("role", "region");
			el.setAttribute("aria-label", `Page ${n + 1} of ${pages.length}: ${page.title}`);
			const number = page.kind ? "" : `<span class="page__num">${String(n).padStart(2, "0")}</span>`;
			el.innerHTML = `
				${number}
				<h2 class="page__title">${escapeHTML(page.title)}</h2>
				<svg class="page__squiggle" aria-hidden="true"><use href="#squiggle"/></svg>
				<div class="page__art">${illustration(page.illustration)}</div>
				<p class="page__body">${escapeHTML(page.body)}</p>`;
			if (page.kind === "end") el.append(el.querySelector(".page__art"));
			return el;
		}

		function firstPageOf(i) {
			const v = views[i];
			return v ? (v.pages.find((p) => p != null) ?? 0) : 0;
		}

		function build(nextMode) {
			const keepPage = views.length ? firstPageOf(index) : 0;
			mode = nextMode;
			views.forEach((v) => v.el.remove());
			views = [];
			if (mode === "spread") {
				// Spread k shows pages 2k-1 and 2k: the cover sits alone on the right, like a closed book.
				const count = Math.ceil((pages.length + 1) / 2);
				for (let k = 0; k < count; k++) {
					const l = 2 * k - 1, r = 2 * k;
					views.push({ pages: [l >= 0 && l < pages.length ? l : null, r < pages.length ? r : null] });
				}
			} else {
				pages.forEach((_, n) => views.push({ pages: [n] }));
			}
			const fragment = document.createDocumentFragment();
			views.forEach((v) => {
				v.el = document.createElement("section");
				v.el.className = "view";
				v.el.style.width = `${mode === "spread" ? SPREAD_W : PAGE_W}px`;
				if (mode === "spread") {
					if (v.pages[0] != null) v.el.append(renderPage(v.pages[0], "left"));
					if (v.pages[1] != null) v.el.append(renderPage(v.pages[1], "right"));
				} else {
					v.el.append(renderPage(v.pages[0], "single"));
				}
				fragment.append(v.el);
			});
			scene.prepend(fragment);
			index = Math.max(0, views.findIndex((v) => v.pages.includes(keepPage)));
			views[index].el.classList.add("is-active");
			flip.reset();
			update(false);
		}

		const viewWidth = () => (mode === "spread" ? SPREAD_W : PAGE_W);
		const spineX = () => (mode === "spread" ? PAGE_W : 0);

		function pageBg(n) {
			const page = pages[n];
			return page?.kind === "cover" ? "var(--accent)" : "var(--paper)";
		}

		const flip = Flipbook.create({
			scene,
			width: SPREAD_W,
			height: PAGE_H,
			duration: 860,
			count: () => views.length,
			getIndex: () => index,
			spine: spineX,
			getLive: (i) => views[i]?.el || null,
			box(i, face) {
				const v = views[i];
				if (mode === "single") {
					return face === "front"
						? { x0: 0, x1: PAGE_W, y0: 0, y1: PAGE_H, bg: pageBg(v.pages[0]), radius: 6 }
						: { x0: -PAGE_W, x1: 0, y0: 0, y1: PAGE_H, bg: "var(--paper)", radius: 6 };
				}
				return face === "front"
					? { x0: PAGE_W, x1: SPREAD_W, y0: 0, y1: PAGE_H, bg: pageBg(v.pages[1]), radius: 6 }
					: { x0: 0, x1: PAGE_W, y0: 0, y1: PAGE_H, bg: pageBg(v.pages[0]), radius: 6 };
			},
			mount(host, i) {
				const copy = views[i].el.cloneNode(true);
				copy.classList.remove("is-active");
				copy.querySelectorAll("[tabindex], [role], [aria-label]").forEach((n) => {
					n.removeAttribute("tabindex");
					n.removeAttribute("role");
					n.removeAttribute("aria-label");
				});
				host.replaceChildren(copy);
				return Promise.resolve();
			},
			commit(to, from) {
				const hadFocus = views[from].el.contains(document.activeElement);
				views[from].el.classList.remove("is-active");
				views[to].el.classList.add("is-active");
				index = to;
				update(true);
				if (hadFocus) views[to].el.querySelector(".page")?.focus({ preventScroll: true });
			}
		});

		function update(announce) {
			const shown = views[index].pages.filter((p) => p != null);
			const label = shown.length > 1 ? `Pages ${shown[0] + 1}–${shown[1] + 1}` : `Page ${shown[0] + 1}`;
			counter.textContent = `${label} / ${pages.length}`;
			prev.disabled = index === 0;
			next.disabled = index === views.length - 1;
			if (announce) {
				status.textContent = `Page ${shown[0] + 1} of ${pages.length}: ${shown.map((p) => pages[p].title).join(", ")}`;
			}
		}

		function fit() {
			const availW = stage.clientWidth - 32;
			const availH = stage.clientHeight - 24;
			const spreadScale = Math.min(availW / SPREAD_W, availH / PAGE_H);
			const wanted = window.innerWidth >= 860 && spreadScale >= 0.42 ? "spread" : "single";
			if (wanted !== mode) build(wanted);
			const scale = Math.min(availW / viewWidth(), availH / PAGE_H);
			book.style.width = `${viewWidth() * scale}px`;
			book.style.height = `${PAGE_H * scale}px`;
			scene.style.width = `${viewWidth()}px`;
			scene.style.transform = `scale(${scale})`;
			const layer = scene.querySelector(".fb-layer");
			if (layer) layer.style.perspectiveOrigin = `${viewWidth() / 2}px 50%`;
		}

		const toLogical = (e) => {
			const r = scene.getBoundingClientRect();
			const k = r.width / viewWidth() || 1;
			return { x: (e.clientX - r.left) / k, y: (e.clientY - r.top) / k };
		};

		Flipbook.bindPointer(flip, book, { toLogical, width: viewWidth, edgeZone: 110 });
		Flipbook.bindWheel(flip, book);
		prev.addEventListener("click", () => flip.turn(-1));
		next.addEventListener("click", () => flip.turn(1));
		document.addEventListener("keydown", (e) => {
			if (e.target.closest?.("input, textarea, select, [contenteditable]")) return;
			if (e.key === "ArrowRight") { e.preventDefault(); flip.turn(1); }
			if (e.key === "ArrowLeft") { e.preventDefault(); flip.turn(-1); }
		});
		new ResizeObserver(fit).observe(stage);
		fit();
		update(false);
	})();
	</script>
</body>
</html>
