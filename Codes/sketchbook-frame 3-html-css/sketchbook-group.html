<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	
	<link rel="stylesheet" href="css/reset.css" />
	<link rel="stylesheet" href="css/fonts.css" />
	<link rel="stylesheet" href="css/global.css" />
	<link rel="stylesheet" href="css/sketchbook-group.css?v=6" />

</head>

<body>
	<div class="row">
		<img src="assets/img.png" class="img1" />
		<div class="text-input"></div>
		<img src="assets/img2.png" class="img2" />
		<img src="assets/img3.png" class="img3" />
		<img src="assets/rating.svg" class="rating" alt="Goldfish sticker" role="button" tabindex="0" title="Swim!" />
		<img src="assets/img4.png" class="img4" />
		<img src="assets/img5.png" class="img5" />
		
		<div class="col-left">
			<p class="text-a text1">Agency Work</p>
			<p class="text-b text2">Beauty Brands </p>
		</div>
		
		<div class="col">
			<p class="text-a text-top">College Works</p>
			<p class="text-b text-campaigns">Campaigns</p>
			<img src="assets/img6.png" class="img6" alt="Play LOST Video" role="button" tabindex="0" />
		</div>
		
		<img src="assets/img.png" class="img7" />
	</div>

	<script>
		document.querySelector(".img6")?.addEventListener("click", () => {
			if (window.parent && window.parent !== window && typeof window.parent.openLostVideo === "function") {
				window.parent.openLostVideo();
			}
		});

		const fish = document.querySelector(".rating");
		function spawnBubbles(element) {
			const rect = element.getBoundingClientRect();
			const parent = element.closest(".row") || document.body;
			const parentRect = parent.getBoundingClientRect();
			const originX = (rect.right - parentRect.left) - 16;
			const originY = (rect.top - parentRect.top) + rect.height * 0.65;

			for (let i = 0; i < 3; i++) {
				setTimeout(() => {
					const bubble = document.createElement("span");
					bubble.className = "fish-bubble";
					const size = 7 + Math.random() * 8;
					bubble.style.width = `${size}px`;
					bubble.style.height = `${size}px`;
					bubble.style.left = `${originX + (Math.random() * 10 - 5)}px`;
					bubble.style.top = `${originY + (Math.random() * 8 - 4)}px`;
					parent.appendChild(bubble);
					setTimeout(() => bubble.remove(), 1200);
				}, i * 140);
			}
		}
		window.spawnBubbles = spawnBubbles;

		function dartFish() {
			if (!fish) return;
			fish.classList.remove("darting");
			void fish.offsetWidth;
			fish.classList.add("darting");
			spawnBubbles(fish);
		}
		window.dartFish = dartFish;

		if (fish) {
			fish.addEventListener("click", (e) => {
				e.stopPropagation();
				dartFish();
			});
			fish.addEventListener("keydown", (e) => {
				if (e.key === "Enter" || e.key === " ") {
					e.preventDefault();
					dartFish();
				}
			});
		}
	</script>
</body>

</html>
